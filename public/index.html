<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzaBot - Order Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 50px 20px;
            text-align: center;
        }

        .welcome-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 { 
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .pizza-emoji {
            font-size: 80px;
            animation: bounce 2s infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        p { 
            color: #555; 
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .feature-card {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            font-weight: bold;
            transition: transform 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-5px);
        }

        /* The Floating Chat Button */
        .chat-toggle-btn { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 70px; 
            height: 70px; 
            font-size: 35px; 
            cursor: pointer; 
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
            z-index: 1000; 
            transition: all 0.3s;
            animation: pulse 2s infinite;
        }

        .chat-toggle-btn:hover { 
            transform: scale(1.15) rotate(10deg);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4); }
            50% { box-shadow: 0 6px 30px rgba(245, 87, 108, 0.7); }
        }

        /* The Chat Container */
        .chat-container { 
            position: fixed; 
            bottom: 110px; 
            right: 30px; 
            width: 380px; 
            height: 500px; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.3); 
            display: none; 
            flex-direction: column; 
            overflow: hidden; 
            z-index: 1000;
            animation: popIn 0.3s ease-out;
            border: 3px solid transparent;
            background-clip: padding-box;
        }

        .chat-container::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -3px;
            border-radius: inherit;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .chat-container.open { display: flex; }

        .chat-header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            padding: 20px; 
            text-align: center; 
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
        }

        .message { 
            margin-bottom: 15px; 
            padding: 12px 18px; 
            border-radius: 18px; 
            max-width: 80%; 
            word-wrap: break-word; 
            white-space: pre-line; 
            font-size: 14px;
            animation: messageSlide 0.3s ease-out;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-msg { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto; 
            text-align: right; 
            border-bottom-right-radius: 4px;
        }

        .bot-msg { 
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            margin-right: auto; 
            border-bottom-left-radius: 4px;
        }

        .input-area { 
            display: flex; 
            padding: 15px;
            background: white;
            border-top: 2px solid #e9ecef;
        }

        input { 
            flex: 1; 
            padding: 15px; 
            border: 2px solid #e9ecef;
            border-radius: 25px;
            outline: none; 
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        button.send-btn { 
            margin-left: 10px;
            padding: 15px 25px; 
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white; 
            border: none; 
            border-radius: 25px;
            cursor: pointer; 
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(245, 87, 108, 0.3);
        }

        button.send-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(245, 87, 108, 0.4);
        }

        /* Scrollbar Styling */
        .chat-box::-webkit-scrollbar {
            width: 8px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        @media (max-width: 480px) {
            .chat-container {
                width: 90%;
                right: 5%;
                left: 5%;
            }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="pizza-emoji">🍕</div>
        <h1>Welcome to PizzaBot Pizzeria!</h1>
        <p>Your favorite pizzas delivered with just a click! 🚀</p>
        
        <div class="features">
            <div class="feature-card">⚡ Fast Delivery</div>
            <div class="feature-card"> Hot & Fresh</div>
            <div class="feature-card">💳 Easy Order</div>
        </div>
    </div>

    <!-- Floating Toggle Button -->
    <button class="chat-toggle-btn" onclick="toggleChat()" title="Chat with us!">💬</button>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">🍕 PizzaBot Assistant</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">Hello! Welcome to PizzaBot! 🎉<br>How can I help you today?<br>Try saying 'menu' or 'order'!</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message..." onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="sendMessage()">Send ➤</button>
        </div>
    </div>

    <script>
        // Toggle chat open/close
        function toggleChat() {
            document.getElementById('chatContainer').classList.toggle('open');
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const userText = inputField.value.trim();

            if (userText === '') return;

            // Display User Message
            chatBox.innerHTML += `<div class="message user-msg">${userText}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Send to Node.js Backend
            try {
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText })
                });
                
                const data = await response.json();
                
                // Display Bot Message
                chatBox.innerHTML += `<div class="message bot-msg">${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                console.error('Error:', error);
                chatBox.innerHTML += `<div class="message bot-msg">Sorry, something went wrong! 😅</div>`;
            }
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
